[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sri-guard"
version = "0.1.0"
description = "Subresource Integrity (SRI) checker for HTML pages: missing, malformed, and mismatching integrity metadata on external scripts and stylesheets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Priyanshu Kumar Thakur" }]
keywords = ["sri", "subresource-integrity", "security", "html", "csp", "web-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sri-guard = "sri_guard.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/sri-guard"
Repository = "https://github.com/gravion-ux/sri-guard"

[tool.hatch.build.targets.wheel]
packages = ["src/sri_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
